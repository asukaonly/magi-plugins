[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["terminal_history"]
id = "terminal-history"
name = "Terminal History"
name_i18n = { "zh-CN" = "终端历史" }
icon = "lucide:terminal"
version = "0.3.0"
description = "Reads your shell command history so Magi can understand your development workflow, tools used, and technical habits."
description_i18n = { "zh-CN" = "读取 Shell 命令历史，帮助 Magi 了解你的开发工作流、常用工具和技术操作习惯" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "TerminalHistoryPlugin"
official = true
contribution_types = ["source"]
platforms = ["macos"]

[plugin.default_settings.sources.terminal_history]
enabled = false
sync_interval_minutes = 15
initial_sync_policy = "lookback_days"
initial_sync_lookback_days = 7
initial_sync_configured = false
sensitive_mode = "redact"
sensitive_keywords = []
dedup_window_seconds = 60
default_retention_mode = "analyze_only"
[plugin.suggestion_descriptor]
category = "terminal"
platform_support = ["darwin"]
setup_time_estimate_seconds = 10
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["命令", "终端", "敲了什么", "跑过什么命令", "shell"]
en = ["terminal", "command", "shell", "ran", "cli"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能看到你最近敲过哪些命令"
en = "Lets magi see your recent terminal commands"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "file_exists"

[plugin.suggestion_descriptor.local_requirements.paths_per_platform]
darwin = "~/.zsh_history"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
scope = ["~/.zsh_history", "~/.bash_history", "~/.local/share/fish"]
reason_i18n = { en = "Read your shell command history files", "zh-CN" = "读取你的 shell 命令历史文件" }

[plugin.activation_flow]
title = "Enable Terminal History"
description = "Terminal history contains commands you've executed. Choose how much history should be imported when this source is enabled for the first time."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sources.terminal_history.enabled"
configured_key = "sources.terminal_history.initial_sync_configured"
fields = [{ "key" = "sources.terminal_history.initial_sync_policy", "type" = "select", "label" = "First Sync Scope", "description" = "Decide how much command history should be imported.", "default" = "lookback_days", "required" = false, "options" = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new commands from now", "value" = "from_now" }], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sources.terminal_history.initial_sync_lookback_days", "type" = "number", "label" = "Recent Days", "description" = "Used when the first-sync scope is set to recent days.", "default" = 7, "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_key" = "sources.terminal_history.initial_sync_policy", "depends_on_values" = ["lookback_days"] }]

[[plugin.settings_fields]]
key = "sources.terminal_history.dedup_window_seconds"
type = "number"
label = "Dedup Window (seconds)"
description = "Time window for session-based command deduplication."
default = 60
required = false
section = "general"
surface = "timeline"
order = 60
minimum = 0.0
maximum = 3600.0

[[plugin.settings_fields]]
key = "sources.terminal_history.default_retention_mode"
type = "select"
label = "Retention Mode"
description = "How terminal history data should be retained."
default = "analyze_only"
required = false
options = [{ "label" = "Analyze Only", "value" = "analyze_only" }, { "label" = "Full Retention", "value" = "full" }]
section = "retention"
surface = "timeline"
order = 30

[[plugin.settings_fields]]
key = "sources.terminal_history.enabled"
type = "switch"
label = "Enabled"
description = "Whether terminal history sync is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.terminal_history.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.terminal_history.initial_sync_lookback_days"
type = "number"
label = "Recent Days"
description = "Used when the first-sync scope is set to recent days."
default = 7
required = false
section = "activation"
surface = "timeline"
order = 20
depends_on_key = "sources.terminal_history.initial_sync_policy"
depends_on_values = ["lookback_days"]

[[plugin.settings_fields]]
key = "sources.terminal_history.initial_sync_policy"
type = "select"
label = "First Sync Scope"
description = "Decide how much command history should be imported."
default = "lookback_days"
required = false
options = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new commands from now", "value" = "from_now" }]
section = "activation"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.terminal_history.sensitive_keywords"
type = "tags"
label = "Additional Sensitive Keywords"
description = "Extra keywords to detect sensitive commands (built-in: password, token, api_key, etc.)"
default = []
required = false
section = "privacy"
surface = "timeline"
order = 50

[[plugin.settings_fields]]
key = "sources.terminal_history.sensitive_mode"
type = "select"
label = "Sensitive Command Mode"
description = "How to handle commands containing sensitive information."
default = "redact"
required = false
options = [{ "label" = "Redact sensitive parts", "value" = "redact" }, { "label" = "Block entire command", "value" = "block" }]
section = "privacy"
surface = "timeline"
order = 40

[[plugin.settings_fields]]
key = "sources.terminal_history.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "How often to check for new terminal commands."
default = 15
required = false
section = "general"
surface = "timeline"
order = 20
minimum = 1.0
maximum = 1440.0
