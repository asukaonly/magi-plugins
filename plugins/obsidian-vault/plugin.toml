[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["obsidian_vault", "obsidian_vault_search"]
id = "obsidian-vault"
name = "Obsidian Vault"
name_i18n = { "zh-CN" = "Obsidian 笔记库" }
icon = "asset:assets/icon.svg"
version = "0.3.1"
description = "Optional. Reads markdown notes locally from an Obsidian vault (wikilinks, tags, frontmatter) so Magi can connect what you write to the rest of your activity. Off by default; notes never leave your device, and you can exclude any folder."
description_i18n = { "zh-CN" = "可选。在本地读取 Obsidian 笔记库的 markdown（含 wikilink、标签、frontmatter），让 Magi 把你写的内容和其他活动连起来。默认关闭；笔记不出本机，任意文件夹都可排除。" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "ObsidianVaultPlugin"
official = false
contribution_types = ["source"]
platforms = ["macos", "windows"]

[plugin.default_settings.sources.obsidian_vault]
enabled = false
vault_path = ""
exclude_folders = [".obsidian", ".trash", "Templates"]
cognition_exclude_folders = ["Clippings", "References"]
sync_interval_minutes = 10
initial_sync_configured = false

[plugin.suggestion_descriptor]
category = "notes"
platform_support = ["darwin", "win32"]
setup_time_estimate_seconds = 20
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["笔记", "obsidian", "vault", "记了什么", "写过", "知识库"]
en = ["notes", "obsidian", "vault", "wrote", "knowledge base", "markdown"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能看到你在笔记里写了什么"
en = "Lets magi see what you write in your notes"

[plugin.suggestion_descriptor.surfaces.first_context]
order = 50

[plugin.suggestion_descriptor.surfaces.first_context.rationale]
zh = "从笔记中了解你正在整理和思考的内容"
en = "Understand what you are organizing and thinking about from your notes"

[plugin.suggestion_descriptor.surfaces.first_context.scope]
zh = "你选择笔记库中的 Markdown"
en = "Markdown from the vault you choose"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
reason_i18n = { en = "Read markdown notes from your Obsidian vault", "zh-CN" = "读取你 Obsidian 库中的 markdown 笔记" }

[plugin.activation_flow]
title = "Enable Obsidian Vault"
description = "Choose the Obsidian vault Magi may read before enabling this source."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sources.obsidian_vault.enabled"
configured_key = "sources.obsidian_vault.initial_sync_configured"
fields = [{ "key" = "sources.obsidian_vault.vault_path", "type" = "path", "path_kind" = "directory", "label" = "Obsidian Vault Folder", "description" = "Choose the vault root folder that contains the .obsidian directory.", "default" = "", "required" = true, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sources.obsidian_vault.cognition_exclude_folders", "type" = "tags", "label" = "Search-only Folders", "description" = "Folders read for search but kept out of knowledge extraction.", "default" = ["Clippings", "References"], "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_values" = [] }]
first_context = { "max_items_per_sync" = 200, "settings_overrides" = {  } }

[[plugin.settings_fields]]
key = "sources.obsidian_vault.cognition_exclude_folders"
type = "tags"
label = "Search-only Folders"
description = "Folders read for search but kept out of the knowledge graph (e.g. clippings, references)."
default = ["Clippings", "References"]
required = false
section = "privacy"
surface = "timeline"
order = 40

[[plugin.settings_fields]]
key = "sources.obsidian_vault.enabled"
type = "switch"
label = "Enabled"
description = "Whether the Obsidian vault source is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.obsidian_vault.exclude_folders"
type = "tags"
label = "Excluded Folders"
description = "Folders never read at all (privacy). Defaults skip Obsidian internals."
default = [".obsidian", ".trash", "Templates"]
required = false
section = "privacy"
surface = "timeline"
order = 30

[[plugin.settings_fields]]
key = "sources.obsidian_vault.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.obsidian_vault.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "How often to rescan the vault for changes."
default = 10
required = false
section = "general"
surface = "timeline"
order = 50
minimum = 1.0
maximum = 1440.0

[[plugin.settings_fields]]
key = "sources.obsidian_vault.vault_path"
type = "path"
path_kind = "directory"
label = "Obsidian Vault Folder"
description = "Choose the vault root folder that contains the .obsidian directory."
default = ""
required = true
section = "general"
surface = "timeline"
order = 20
