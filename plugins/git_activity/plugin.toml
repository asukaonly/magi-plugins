[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["git_activity"]
id = "git-activity"
name = "Git Activity"
name_i18n = { "zh-CN" = "Git 活动" }
icon = "asset:assets/icon.svg"
version = "0.2.0"
description = "Tracks your Git commits and repository checkouts so Magi can understand your coding projects and development workflow."
description_i18n = { "zh-CN" = "追踪 Git 提交和分支操作，帮助 Magi 了解你的开发项目和工作流" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "GitActivityPlugin"
official = true
contribution_types = ["sensor"]
platforms = ["macos", "windows"]

[plugin.default_settings.sensors.git_activity]
enabled = false
repos = []
sync_interval_minutes = 30
initial_sync_policy = "lookback_days"
initial_sync_lookback_days = 30
sensitive_mode = "redact"
sensitive_keywords = []
default_retention_mode = "analyze_only"

[plugin.suggestion_descriptor]
category = "code_activity"
platform_support = ["darwin", "win32"]
setup_time_estimate_seconds = 15
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["代码", "提交", "commit", "改了什么", "项目", "仓库", "repo", "git", "写了什么"]
en = ["code", "commit", "changed", "repo", "repository", "project", "git", "pull request"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能看到你的代码改动和项目进度"
en = "Lets magi see what you've been building"

[plugin.suggestion_descriptor.surfaces.empty_state]
order = 40

[plugin.suggestion_descriptor.surfaces.empty_state.rationale]
zh = "让 magi 看到你在做什么项目"
en = "Lets magi see what you've been building"

[plugin.suggestion_descriptor.surfaces.first_context]
order = 40

[plugin.suggestion_descriptor.surfaces.first_context.rationale]
zh = "从提交记录中了解正在推进的项目"
en = "Understand active projects from recent commits"

[plugin.suggestion_descriptor.surfaces.first_context.scope]
zh = "最近 30 天的提交和分支活动"
en = "Commits and branch activity from the last 30 days"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "executable_in_path"
names = ["git", "git.exe"]

[[plugin.permissions.capabilities]]
capability = "subprocess"
scope = ["git"]
reason_i18n = { en = "Run git to read commit and checkout history", "zh-CN" = "调用 git 读取提交与检出历史" }

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
reason_i18n = { en = "Discover and read local git repositories", "zh-CN" = "发现并读取本地 git 仓库" }

[plugin.activation_flow]
title = "Enable Git Activity"
description = "Git activity can reveal repository names and local work patterns. Choose how the first sync should seed the timeline before this source starts running."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sensors.git_activity.enabled"
configured_key = "sensors.git_activity.initial_sync_configured"
fields = [{ "key" = "sensors.git_activity.initial_sync_policy", "type" = "select", "label" = "First Sync Scope", "description" = "Decide how much Git history should be imported when this source is enabled for the first time.", "default" = "lookback_days", "required" = false, "options" = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sensors.git_activity.initial_sync_lookback_days", "type" = "number", "label" = "Recent Days", "description" = "Used when the first-sync scope is set to recent days.", "default" = 30, "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_key" = "sensors.git_activity.initial_sync_policy", "depends_on_values" = ["lookback_days"], "minimum" = 1.0, "maximum" = 365.0 }, { "key" = "sensors.git_activity.repos", "type" = "path", "label" = "Repository Folders", "description" = "Select one or more Git repository folders to monitor.", "default" = [], "required" = true, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 30, "depends_on_values" = [] }]
first_context = { "max_items_per_sync" = 200, "settings_overrides" = {  } }

[[plugin.settings_fields]]
key = "sensors.git_activity.default_retention_mode"
type = "input"
label = "Default Retention Mode"
description = ""
default = "analyze_only"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.git_activity.enabled"
type = "switch"
label = "Enabled"
description = "Whether git activity sync is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sensors.git_activity.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.git_activity.initial_sync_lookback_days"
type = "number"
label = "Recent Days"
description = "Used when the first-sync scope is set to recent days."
default = 30
required = false
section = "activation"
surface = "timeline"
order = 20
depends_on_key = "sensors.git_activity.initial_sync_policy"
depends_on_values = ["lookback_days"]
minimum = 1.0
maximum = 365.0

[[plugin.settings_fields]]
key = "sensors.git_activity.initial_sync_policy"
type = "select"
label = "First Sync Scope"
description = "Decide how much Git history should be imported when this source is enabled for the first time."
default = "lookback_days"
required = false
options = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }]
section = "activation"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sensors.git_activity.max_messages_per_session"
type = "number"
label = "Max Messages Per Session"
description = ""
default = 5
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.git_activity.repos"
type = "path"
label = "Repositories"
description = "Select one or more Git repository folders to monitor."
required = false
section = "general"
surface = "timeline"
order = 20

[[plugin.settings_fields]]
key = "sensors.git_activity.sensitive_keywords"
type = "tags"
label = "Additional Sensitive Keywords"
description = "Extra keywords to detect in commit messages (built-in: password, secret, token, etc.)"
required = false
section = "privacy"
surface = "timeline"
order = 70

[[plugin.settings_fields]]
key = "sensors.git_activity.sensitive_mode"
type = "select"
label = "Sensitive Message Mode"
description = "How to handle commit messages with sensitive content."
default = "redact"
required = false
options = [{ "label" = "Redact sensitive parts", "value" = "redact" }, { "label" = "Block entirely", "value" = "block" }]
section = "privacy"
surface = "timeline"
order = 60

[[plugin.settings_fields]]
key = "sensors.git_activity.session_window_minutes"
type = "number"
label = "Session Window Minutes"
description = ""
default = 30
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.git_activity.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "How often to check for new git activity."
default = 30
required = false
section = "general"
surface = "timeline"
order = 30
minimum = 5.0
maximum = 1440.0
