[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["chrome_history"]
id = "chrome-history"
name = "Chrome History"
name_i18n = { "zh-CN" = "Chrome 浏览器历史" }
icon = "asset:assets/icon.svg"
version = "0.2.1"
description = "Reads your local Chrome browsing history so Magi can understand your interests, research habits, and frequently visited sites."
description_i18n = { "zh-CN" = "读取本地 Chrome 浏览记录，帮助 Magi 了解你的兴趣方向、研究习惯和常访站点" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "ChromeHistoryPlugin"
official = true
contribution_types = ["sensor"]
depends_on = ["browser_history_core"]
platforms = ["macos", "windows"]

[plugin.display_group]
id = "browser_history"
name = "Browser History"
name_i18n = { "zh-CN" = "浏览器历史" }
description = "Manage browser history sources from installed browser plugins."
description_i18n = { "zh-CN" = "统一管理浏览器历史入口。" }
icon = "lucide:globe"
order = 10
member_label = "Chrome"
member_label_i18n = { "zh-CN" = "Chrome" }
member_order = 10

[plugin.default_settings.sensors.chrome_history]
enabled = false
sync_mode = "interval"
sync_interval_minutes = 30
default_retention_mode = "analyze_only"
storage_mode = "managed"
profile = "Default"
lookback_hours = 24
max_items_per_sync = 1000
edge_whitelist = ["VISITED", "VIEWED"]

[plugin.suggestion_descriptor]
category = "browser_history"
platform_support = ["darwin", "win32"]
setup_time_estimate_seconds = 10
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["浏览", "上网", "看过", "网页", "网站", "搜过", "查过"]
en = ["browsing", "browser", "website", "online", "bookmark", "browsed", "history"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能读取你的 Chrome 历史，帮你回想最近看过什么"
en = "Lets magi see what you've been reading in Chrome"

[plugin.suggestion_descriptor.surfaces.empty_state]
order = 10

[plugin.suggestion_descriptor.surfaces.empty_state.rationale]
zh = "让 magi 看到你最近在网上读什么"
en = "Lets magi see what you've been reading online"

[plugin.suggestion_descriptor.surfaces.first_context]
order = 10

[plugin.suggestion_descriptor.surfaces.first_context.rationale]
zh = "从最近浏览中了解你正在关注的问题"
en = "Continue from the topics you have been exploring recently"

[plugin.suggestion_descriptor.surfaces.first_context.scope]
zh = "最近 7 天的页面标题和时间"
en = "Page titles and timestamps from the last 7 days"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "file_exists"

[plugin.suggestion_descriptor.local_requirements.paths_per_platform]
darwin = "~/Library/Application Support/Google/Chrome/Default/History"
win32 = "%LOCALAPPDATA%/Google/Chrome/User Data/Default/History"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
scope = ["~/Library/Application Support/Google/Chrome", "%LOCALAPPDATA%\\Google\\Chrome"]
reason_i18n = { en = "Read the local Chrome history database", "zh-CN" = "读取本地 Chrome 历史数据库" }

[plugin.activation_flow]
title = "Enable Chrome History"
description = "Chrome history is sensitive local data. Choose how the first sync should seed the timeline before this source starts running."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sensors.chrome_history.enabled"
configured_key = "sensors.chrome_history.initial_sync_configured"
fields = [{ "key" = "sensors.chrome_history.initial_sync_policy", "type" = "select", "label" = "First Sync Scope", "description" = "Decide how much history should be imported when this source is enabled for the first time.", "default" = "lookback_days", "required" = false, "options" = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sensors.chrome_history.initial_sync_lookback_days", "type" = "number", "label" = "Recent Days", "description" = "Used when the first-sync scope is set to recent days.", "default" = 7, "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_key" = "sensors.chrome_history.initial_sync_policy", "depends_on_values" = ["lookback_days"] }]
first_context = { "max_items_per_sync" = 200, "settings_overrides" = { "sensors.chrome_history.initial_sync_policy" = "lookback_days", "sensors.chrome_history.initial_sync_lookback_days" = 7 } }

[[plugin.settings_fields]]
key = "sensors.chrome_history.default_retention_mode"
type = "input"
label = "Default Retention Mode"
description = ""
default = "analyze_only"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.chrome_history.edge_whitelist"
type = "tags"
label = "Edge Whitelist"
description = ""
default = ["VISITED", "VIEWED"]
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.chrome_history.enabled"
type = "switch"
label = "Enabled"
description = "Whether Chrome history sync is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sensors.chrome_history.filter_domains"
type = "tags"
label = "Filter Domains (Regex)"
description = "Visits whose normalized domain matches any regex via partial search are skipped before AI analysis. Use ^...$ for exact matches."
default = []
required = false
section = "filters"
surface = "timeline"
order = 70
placeholder = "e.g. ^mail\\.google\\.com$"

[[plugin.settings_fields]]
key = "sensors.chrome_history.filter_keywords"
type = "tags"
label = "Filter Keywords"
description = "Visits whose URL or title contains any of these keywords are skipped before AI analysis. Case-insensitive substring match, not regex."
default = []
required = false
section = "filters"
surface = "timeline"
order = 80
placeholder = "e.g. password reset"

[[plugin.settings_fields]]
key = "sensors.chrome_history.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.chrome_history.initial_sync_lookback_days"
type = "number"
label = "Recent Days"
description = "Used when the first-sync scope is set to recent days."
default = 7
required = false
section = "activation"
surface = "timeline"
order = 20
depends_on_key = "sensors.chrome_history.initial_sync_policy"
depends_on_values = ["lookback_days"]

[[plugin.settings_fields]]
key = "sensors.chrome_history.initial_sync_policy"
type = "select"
label = "First Sync Scope"
description = "Decide how much history should be imported when this source is enabled for the first time."
default = "lookback_days"
required = false
options = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }]
section = "activation"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sensors.chrome_history.lookback_hours"
type = "number"
label = "Lookback Hours"
description = ""
default = 24
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.chrome_history.max_items_per_sync"
type = "number"
label = "Max Items Per Sync"
description = "Maximum number of history records to ingest per run."
default = 1000
required = false
section = "sync"
surface = "timeline"
order = 60

[[plugin.settings_fields]]
key = "sensors.chrome_history.merge_window_minutes"
type = "number"
label = "Merge Window (minutes)"
description = "Raw visits to the same page within this window are merged into one timeline item, even when other pages appear between them."
default = 30
required = false
section = "general"
surface = "timeline"
order = 50

[[plugin.settings_fields]]
key = "sensors.chrome_history.profile"
type = "input"
label = "Profile"
description = "Chrome profile directory to read, such as Default or Profile 1."
default = "Default"
required = false
section = "general"
surface = "timeline"
order = 20

[[plugin.settings_fields]]
key = "sensors.chrome_history.storage_mode"
type = "input"
label = "Storage Mode"
description = ""
default = "managed"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sensors.chrome_history.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "Polling interval used for interval-based sync."
default = 30
required = false
section = "general"
surface = "timeline"
order = 40
depends_on_key = "sensors.chrome_history.sync_mode"
depends_on_values = ["interval"]

[[plugin.settings_fields]]
key = "sensors.chrome_history.sync_mode"
type = "select"
label = "Sync Mode"
description = "How Chrome history should be synchronized."
default = "interval"
required = true
options = [{ "label" = "Manual", "value" = "manual" }, { "label" = "Interval", "value" = "interval" }]
section = "general"
surface = "timeline"
order = 30
