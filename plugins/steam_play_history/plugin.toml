[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["steam_play_history"]
id = "steam-play-history"
name = "Steam"
name_i18n = { "zh-CN" = "Steam" }
icon = "asset:assets/icon.svg"
version = "0.3.2"
description = "Infers Steam game records from local Steam files and playtime changes."
description_i18n = { "zh-CN" = "根据本地 Steam 文件和游玩时长变化推断游戏记录" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "SteamPlayHistoryPlugin"
official = true
contribution_types = ["source"]
platforms = ["windows", "macos", "linux"]

[plugin.display_group]
id = "game_records"
name = "Game Records"
name_i18n = { "zh-CN" = "游戏记录" }
description = "Manage game activity sources from installed game plugins."
description_i18n = { "zh-CN" = "统一管理游戏记录入口。" }
icon = "lucide:gamepad-2"
order = 40
member_label = "Steam"
member_label_i18n = { "zh-CN" = "Steam" }
member_order = 10

[plugin.suggestion_descriptor]
category = "gaming"
platform_support = ["win32", "darwin", "linux"]
setup_time_estimate_seconds = 15
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["玩了什么游戏", "游戏", "Steam", "游戏时长", "最近在玩"]
en = ["played", "game", "steam", "playtime", "gaming"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能看到你最近玩了什么游戏"
en = "Lets magi see what games you've been playing"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "file_exists"

[plugin.suggestion_descriptor.local_requirements.paths_per_platform]
darwin = "~/Library/Application Support/Steam"
win32 = "%ProgramFiles(x86)%/Steam"
linux = "~/.steam/steam"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
scope = ["~/Library/Application Support/Steam", "C:\\Program Files (x86)\\Steam"]
reason_i18n = { en = "Read local Steam files to infer play sessions", "zh-CN" = "读取本地 Steam 文件以推断游戏时段" }

[plugin.activation_flow]
title = "Enable Steam"
description = "Steam game records reveal gaming habits. Choose how the first sync should seed the timeline before this source starts running. Exact sessions are inferred only after the source is enabled."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sources.steam_play_history.enabled"
configured_key = "sources.steam_play_history.initial_sync_configured"
fields = [{ "key" = "sources.steam_play_history.initial_sync_policy", "type" = "select", "label" = "First Sync Scope", "description" = "Decide how much previous Steam activity should be imported.", "default" = "lookback_days", "required" = false, "options" = [{ "label" = "Import all last-played summaries", "value" = "full" }, { "label" = "Import recent last-played summaries", "value" = "lookback_days" }, { "label" = "Only record play from now on", "value" = "from_now" }], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sources.steam_play_history.initial_sync_lookback_days", "type" = "number", "label" = "Recent Days", "description" = "Used when the first-sync scope is set to recent summaries.", "default" = 14, "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_key" = "sources.steam_play_history.initial_sync_policy", "depends_on_values" = ["lookback_days"], "minimum" = 1.0 }]

[[plugin.settings_fields]]
key = "sources.steam_play_history.account_id"
type = "input"
label = "Account Id"
description = ""
default = "auto"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.steam_play_history.default_retention_mode"
type = "input"
label = "Default Retention Mode"
description = ""
default = "analyze_only"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.steam_play_history.enabled"
type = "switch"
label = "Enabled"
description = "Whether Steam game record sync is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.steam_play_history.excluded_appids"
type = "tags"
label = "Excluded Appids"
description = ""
default = []
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.steam_play_history.excluded_keywords"
type = "tags"
label = "Excluded Game Keywords"
description = "Game names containing these case-insensitive keywords are skipped before AI analysis."
default = []
required = false
section = "privacy"
surface = "timeline"
order = 80
placeholder = "e.g. private"

[[plugin.settings_fields]]
key = "sources.steam_play_history.idle_timeout_minutes"
type = "number"
label = "Idle Timeout (minutes)"
description = "A session is closed after this many minutes without additional Steam playtime."
default = 15
required = false
section = "sync"
surface = "timeline"
order = 60
minimum = 2.0

[[plugin.settings_fields]]
key = "sources.steam_play_history.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.steam_play_history.initial_sync_lookback_days"
type = "number"
label = "Recent Days"
description = "Used when the first-sync scope is set to recent summaries."
default = 14
required = false
section = "activation"
surface = "timeline"
order = 20
depends_on_key = "sources.steam_play_history.initial_sync_policy"
depends_on_values = ["lookback_days"]
minimum = 1.0

[[plugin.settings_fields]]
key = "sources.steam_play_history.initial_sync_policy"
type = "select"
label = "First Sync Scope"
description = "Decide how much previous Steam activity should be imported."
default = "lookback_days"
required = false
options = [{ "label" = "Import all last-played summaries", "value" = "full" }, { "label" = "Import recent last-played summaries", "value" = "lookback_days" }, { "label" = "Only record play from now on", "value" = "from_now" }]
section = "activation"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.steam_play_history.max_items_per_sync"
type = "number"
label = "Max Items Per Sync"
description = "Maximum number of Steam records to emit per sync."
default = 500
required = false
section = "sync"
surface = "timeline"
order = 70
minimum = 1.0

[[plugin.settings_fields]]
key = "sources.steam_play_history.min_session_seconds"
type = "number"
label = "Minimum Session Duration (seconds)"
description = "Inferred play sessions shorter than this are ignored."
default = 180
required = false
section = "sync"
surface = "timeline"
order = 50
minimum = 60.0

[[plugin.settings_fields]]
key = "sources.steam_play_history.steam_path"
type = "path"
label = "Steam Path"
description = "Optional Steam install path. Leave empty to auto-detect the local Steam folder."
default = ""
required = false
section = "general"
surface = "timeline"
order = 20

[[plugin.settings_fields]]
key = "sources.steam_play_history.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "How often to poll Steam playtime changes."
default = 10
required = false
section = "sync"
surface = "timeline"
order = 40
depends_on_key = "sources.steam_play_history.sync_mode"
depends_on_values = ["interval"]
minimum = 1.0

[[plugin.settings_fields]]
key = "sources.steam_play_history.sync_mode"
type = "select"
label = "Sync Mode"
description = "How Steam game records should be synchronized."
default = "interval"
required = false
options = [{ "label" = "Manual", "value" = "manual" }, { "label" = "Interval", "value" = "interval" }]
section = "sync"
surface = "timeline"
order = 30
