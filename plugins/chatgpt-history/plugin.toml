[plugin]
settings_fields = []
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = []
id = "chatgpt-history"
name = "ChatGPT History"
name_i18n = { "zh-CN" = "ChatGPT 历史" }
icon = "asset:assets/icon.svg"
version = "0.2.0"
description = "Imports conversations from an official ChatGPT data export without ongoing access to your account."
description_i18n = { "zh-CN" = "从 ChatGPT 官方数据导出文件中一次性导入对话，不会持续访问你的账户。" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "ChatGPTHistoryPlugin"
official = false
data_locality = "local_only"
contribution_types = ["history_importer"]
platforms = ["macos", "windows", "linux"]

[plugin.display_group]
id = "agent_history"
name = "Agent History"
name_i18n = { "zh-CN" = "Agent 历史" }
description = "Manage installed coding-agent history sources."
description_i18n = { "zh-CN" = "统一管理已安装的编程助手历史来源。" }
icon = "lucide:bot"
order = 40
member_label = "ChatGPT"
member_label_i18n = { "zh-CN" = "ChatGPT" }
member_order = 5

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
reason_i18n = { en = "Read only the ChatGPT export files selected by the user", "zh-CN" = "仅读取用户选择的 ChatGPT 导出文件" }
