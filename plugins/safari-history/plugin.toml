[plugin]
settings_actions = []
settings_resources = [{ "resource_name" = "permissions", "resource_type" = "channel_status", "requires_enabled" = false, "description" = "Live macOS permission grant required by the Safari history plugin.", "metadata" = {  } }]
settings_ui_blocks = [{ "block_id" = "macos_permissions", "type" = "resource_picker", "title" = "macOS Permissions", "description" = "Full Disk Access is required to read Safari History.db.", "resource_name" = "permissions", "value_key" = "_readonly", "presentation" = "permission_status", "depends_on_values" = [] }]
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["safari_history"]
id = "safari-history"
name = "Safari History"
name_i18n = { "zh-CN" = "Safari 浏览器历史" }
icon = "asset:assets/icon.svg"
version = "0.3.1"
description = "Reads your local Safari browsing history so Magi can understand your interests, research habits, and frequently visited sites."
description_i18n = { "zh-CN" = "读取本地 Safari 浏览记录，帮助 Magi 了解你的兴趣方向、研究习惯和常访站点" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "SafariHistoryPlugin"
official = true
contribution_types = ["source"]
depends_on = ["browser_history_core"]
platforms = ["macos"]

[plugin.display_group]
id = "browser_history"
name = "Browser History"
name_i18n = { "zh-CN" = "浏览器历史" }
description = "Manage browser history sources from installed browser plugins."
description_i18n = { "zh-CN" = "统一管理浏览器历史入口。" }
icon = "lucide:globe"
order = 10
member_label = "Safari"
member_label_i18n = { "zh-CN" = "Safari" }
member_order = 20

[plugin.default_settings.sources.safari_history]
enabled = false
sync_mode = "interval"
sync_interval_minutes = 30
default_retention_mode = "analyze_only"
storage_mode = "managed"
source_path = "~/Library/Safari"
profile = ""
merge_window_minutes = 30
max_items_per_sync = 1000
initial_sync_policy = "lookback_days"
initial_sync_lookback_days = 7
initial_sync_configured = false
filter_domains = []
filter_keywords = []

[plugin.suggestion_descriptor]
category = "browser_history"
platform_support = ["darwin"]
setup_time_estimate_seconds = 10
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["浏览", "上网", "看过", "网页", "网站", "搜过", "查过", "Safari"]
en = ["browsing", "browser", "website", "online", "bookmark", "browsed", "history", "safari"]

[plugin.suggestion_descriptor.rationale]
zh = "magi 能读取你的 Safari 历史，帮你回想最近看过什么"
en = "Lets magi see what you've been reading in Safari"

[plugin.suggestion_descriptor.surfaces.empty_state]
order = 11

[plugin.suggestion_descriptor.surfaces.empty_state.rationale]
zh = "让 magi 看到你最近在网上读什么"
en = "Lets magi see what you've been reading online"

[plugin.suggestion_descriptor.surfaces.first_context]
order = 11

[plugin.suggestion_descriptor.surfaces.first_context.rationale]
zh = "从最近浏览中了解你正在关注的问题"
en = "Continue from the topics you have been exploring recently"

[plugin.suggestion_descriptor.surfaces.first_context.scope]
zh = "最近 7 天的页面标题和时间"
en = "Page titles and timestamps from the last 7 days"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "file_exists"

[plugin.suggestion_descriptor.local_requirements.paths_per_platform]
darwin = "~/Library/Safari/History.db"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
scope = ["~/Library/Safari"]
reason_i18n = { en = "Read the local Safari history database", "zh-CN" = "读取本地 Safari 历史数据库" }

[plugin.activation_flow]
title = "Enable Safari History"
description = "Safari history is sensitive local data. Choose how the first sync should seed the timeline before this source starts running."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sources.safari_history.enabled"
configured_key = "sources.safari_history.initial_sync_configured"
fields = [{ "key" = "sources.safari_history.initial_sync_policy", "type" = "select", "label" = "First Sync Scope", "description" = "Decide how much history should be imported when this source is enabled for the first time.", "default" = "lookback_days", "required" = false, "options" = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }], "section" = "activation", "surface" = "timeline", "order" = 10, "depends_on_values" = [] }, { "key" = "sources.safari_history.initial_sync_lookback_days", "type" = "number", "label" = "Recent Days", "description" = "Used when the first-sync scope is set to recent days.", "default" = 7, "required" = false, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 20, "depends_on_key" = "sources.safari_history.initial_sync_policy", "depends_on_values" = ["lookback_days"] }]
first_context = { "max_items_per_sync" = 200, "settings_overrides" = { "sources.safari_history.initial_sync_policy" = "lookback_days", "sources.safari_history.initial_sync_lookback_days" = 7 } }

[[plugin.settings_fields]]
key = "sources.safari_history.default_retention_mode"
type = "input"
label = "Default Retention Mode"
description = ""
default = "analyze_only"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.safari_history.enabled"
type = "switch"
label = "Enabled"
description = "Whether Safari history sync is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.safari_history.filter_domains"
type = "tags"
label = "Filter Domains (Regex)"
description = "Visits whose normalized domain matches any regex via partial search are skipped before AI analysis. Use ^...$ for exact matches."
default = []
required = false
section = "filters"
surface = "timeline"
order = 70
placeholder = "e.g. ^mail\\.google\\.com$"

[[plugin.settings_fields]]
key = "sources.safari_history.filter_keywords"
type = "tags"
label = "Filter Keywords"
description = "Visits whose URL or title contains any of these keywords are skipped before AI analysis. Case-insensitive substring match, not regex."
default = []
required = false
section = "filters"
surface = "timeline"
order = 80
placeholder = "e.g. password reset"

[[plugin.settings_fields]]
key = "sources.safari_history.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.safari_history.initial_sync_lookback_days"
type = "number"
label = "Recent Days"
description = "Used when the first-sync scope is set to recent days."
default = 7
required = false
section = "activation"
surface = "timeline"
order = 20
depends_on_key = "sources.safari_history.initial_sync_policy"
depends_on_values = ["lookback_days"]

[[plugin.settings_fields]]
key = "sources.safari_history.initial_sync_policy"
type = "select"
label = "First Sync Scope"
description = "Decide how much history should be imported when this source is enabled for the first time."
default = "lookback_days"
required = false
options = [{ "label" = "Sync full history", "value" = "full" }, { "label" = "Sync recent days", "value" = "lookback_days" }, { "label" = "Only new records from now on", "value" = "from_now" }]
section = "activation"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.safari_history.max_items_per_sync"
type = "number"
label = "Max Items Per Sync"
description = "Maximum number of history records to ingest per run."
default = 1000
required = false
section = "sync"
surface = "timeline"
order = 60

[[plugin.settings_fields]]
key = "sources.safari_history.merge_window_minutes"
type = "number"
label = "Merge Window (minutes)"
description = "Raw visits to the same page within this window are merged into one timeline item, even when other pages appear between them."
default = 30
required = false
section = "general"
surface = "timeline"
order = 50

[[plugin.settings_fields]]
key = "sources.safari_history.profile"
type = "input"
label = "Profile"
description = "Safari stores history in one History.db file; leave this empty."
default = ""
required = false
section = "general"
surface = "timeline"
order = 20

[[plugin.settings_fields]]
key = "sources.safari_history.source_path"
type = "input"
label = "Source Path"
description = ""
default = "~/Library/Safari"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.safari_history.storage_mode"
type = "input"
label = "Storage Mode"
description = ""
default = "managed"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.safari_history.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "Polling interval used for interval-based sync."
default = 30
required = false
section = "general"
surface = "timeline"
order = 40
depends_on_key = "sources.safari_history.sync_mode"
depends_on_values = ["interval"]

[[plugin.settings_fields]]
key = "sources.safari_history.sync_mode"
type = "select"
label = "Sync Mode"
description = "How Safari history should be synchronized."
default = "interval"
required = true
options = [{ "label" = "Manual", "value" = "manual" }, { "label" = "Interval", "value" = "interval" }]
section = "general"
surface = "timeline"
order = 30
