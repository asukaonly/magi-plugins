[plugin]
settings_actions = []
settings_resources = []
settings_ui_blocks = []
protocol_version = 2
min_sdk_version = "0.2.0"
execution_mode = "trusted_process"
projection_sources = ["photo_library_directory"]
id = "local-photos"
name = "Local Photos"
name_i18n = { "zh-CN" = "本地照片" }
icon = "lucide:images"
version = "0.3.0"
description = "Scans photo folders you choose and reads capture time, location, and camera metadata."
description_i18n = { "zh-CN" = "扫描你选择的本地照片文件夹，读取拍摄时间、地点和设备信息" }
author = "Magi Team"
entry_module = "plugin"
entry_class = "LocalPhotosPlugin"
official = true
contribution_types = ["source", "tool"]
platforms = ["macos", "windows"]
depends_on = ["photo_library_core"]

[plugin.display_group]
id = "photo_library"
name = "Photo Library"
name_i18n = { "zh-CN" = "照片库" }
description = "Manage installed photo sources."
description_i18n = { "zh-CN" = "统一管理已安装的照片来源。" }
icon = "lucide:images"
order = 30
member_label = "Local Photos"
member_label_i18n = { "zh-CN" = "本地照片" }
member_order = 20

[plugin.default_settings.sources.photo_library_directory]
enabled = false
source_mode = "directory"
sync_mode = "interval"
sync_interval_minutes = 60
default_retention_mode = "analyze_only"
storage_mode = "external_reference"
source_paths = []
exclude_patterns = []
analysis_features = ["exif"]
edge_whitelist = ["CAPTURED", "RELATED_TO", "INTERACTED_WITH", "CREATED"]

[plugin.suggestion_descriptor]
category = "photos"
platform_support = ["darwin", "win32"]
setup_time_estimate_seconds = 20
data_locality = "local_only"

[plugin.suggestion_descriptor.triggers]
intents = []
entities = []

[plugin.suggestion_descriptor.triggers.keywords]
zh = ["本地照片", "照片文件夹", "导出照片", "图片目录"]
en = ["local photos", "photo folder", "exported photos", "picture directory"]

[plugin.suggestion_descriptor.rationale]
zh = "让 magi 读取你选择的照片文件夹"
en = "Lets magi read the photo folders you choose"

[plugin.suggestion_descriptor.surfaces.empty_state]
order = 55

[plugin.suggestion_descriptor.surfaces.empty_state.rationale]
zh = "让 magi 看到你选择的本地照片"
en = "Lets magi see photos from folders you choose"

[plugin.suggestion_descriptor.surfaces.first_context]
order = 65

[plugin.suggestion_descriptor.surfaces.first_context.rationale]
zh = "从照片的时间和地点信息中回想最近的经历"
en = "Recall recent experiences from photo time and location metadata"

[plugin.suggestion_descriptor.surfaces.first_context.scope]
zh = "所选文件夹中照片的时间、地点和设备信息"
en = "Photo time, location, and device metadata from selected folders"

[[plugin.suggestion_descriptor.local_requirements]]
check_kind = "file_exists"

[plugin.suggestion_descriptor.local_requirements.paths_per_platform]
darwin = "~/Pictures"
win32 = "%USERPROFILE%/Pictures"

[[plugin.permissions.capabilities]]
capability = "filesystem_read"
scope = ["~/Pictures"]
reason_i18n = { en = "Read photos from folders you choose", "zh-CN" = "读取你选择的本地照片文件夹" }

[[plugin.permissions.capabilities]]
capability = "network"
scope = ["download.geonames.org"]
optional = true
reason_i18n = { en = "Optionally download the offline GeoNames dataset for local geocoding", "zh-CN" = "可选下载 GeoNames 离线数据，用于在本地识别照片地点" }

[plugin.activation_flow]
title = "Enable Local Photos"
description = "Local Photos is sensitive local data. Magi reads photo metadata (time, place, camera) to build your timeline."
confirm_label = "Enable source"
cancel_label = "Not now"
authorize_on_confirm = false
enabled_key = "sources.photo_library_directory.enabled"
configured_key = "sources.photo_library_directory.initial_sync_configured"
fields = [{ "key" = "sources.photo_library_directory.source_paths", "type" = "path", "label" = "Photo Directories", "description" = "Local folders containing photos to scan. Add one or more.", "default" = [], "required" = true, "options" = [], "section" = "activation", "surface" = "timeline", "order" = 10, "placeholder" = "/path/to/photos", "depends_on_values" = [] }]
first_context = { "max_items_per_sync" = 200, "settings_overrides" = {  } }

[[plugin.settings_fields]]
key = "locale"
type = "input"
label = "Locale"
description = ""
default = ""
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.analysis_features"
type = "tags"
label = "Analysis Features"
description = "Metadata extraction capabilities to apply."
default = ["exif"]
required = false
options = [{ "label" = "EXIF Metadata", "value" = "exif" }, { "label" = "GPS Geocoding", "value" = "geocode" }]
section = "general"
surface = "timeline"
order = 45

[[plugin.settings_fields]]
key = "sources.photo_library_directory.default_retention_mode"
type = "input"
label = "Default Retention Mode"
description = ""
default = "analyze_only"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.edge_whitelist"
type = "tags"
label = "Edge Whitelist"
description = ""
default = ["CAPTURED", "RELATED_TO", "INTERACTED_WITH", "CREATED"]
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.enabled"
type = "switch"
label = "Enable"
description = "Whether this photo source is active."
default = false
required = false
section = "general"
surface = "timeline"
order = 10

[[plugin.settings_fields]]
key = "sources.photo_library_directory.exclude_patterns"
type = "tags"
label = "Exclude Patterns"
description = "Glob patterns for directories or files to skip."
default = ["**/thumbnails", "**/.cache", "**/Thumbs.db", "**/@eaDir"]
required = false
section = "general"
surface = "timeline"
order = 16
placeholder = "**/thumbnails"

[[plugin.settings_fields]]
key = "sources.photo_library_directory.initial_sync_configured"
type = "switch"
label = "Initial Sync Configured"
description = ""
default = false
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.initial_sync_end_date"
type = "input"
label = "Initial Sync End Date"
description = ""
default = ""
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.initial_sync_policy"
type = "input"
label = "Initial Sync Policy"
description = ""
default = ""
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.initial_sync_start_date"
type = "input"
label = "Initial Sync Start Date"
description = ""
default = ""
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.max_items_per_sync"
type = "number"
label = "Max Items Per Sync"
description = "Maximum number of photos to process per sync run."
default = 200
required = false
section = "general"
surface = "timeline"
order = 40

[[plugin.settings_fields]]
key = "sources.photo_library_directory.photos_library_path"
type = "input"
label = "Photos Library Path"
description = ""
default = ""
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.settle_window_hours"
type = "number"
label = "Session Settle Window (hours)"
description = "A photo session is emitted only after no new photos arrive for this many hours."
default = 4
required = false
section = "general"
surface = "timeline"
order = 50

[[plugin.settings_fields]]
key = "sources.photo_library_directory.source_mode"
type = "input"
label = "Source Mode"
description = ""
default = "directory"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.source_paths"
type = "path"
label = "Photo Directories"
description = "Local directories containing photos to scan. Add one or more paths."
default = []
required = true
section = "general"
surface = "timeline"
order = 15
placeholder = "/path/to/photos"

[[plugin.settings_fields]]
key = "sources.photo_library_directory.storage_mode"
type = "input"
label = "Storage Mode"
description = ""
default = "external_reference"
required = false
section = "advanced"
surface = "extensions"
order = 0

[[plugin.settings_fields]]
key = "sources.photo_library_directory.sync_interval_minutes"
type = "number"
label = "Sync Interval (minutes)"
description = "Polling interval used for interval-based sync."
default = 60
required = false
section = "general"
surface = "timeline"
order = 30
depends_on_key = "sources.photo_library_directory.sync_mode"
depends_on_values = ["interval"]

[[plugin.settings_fields]]
key = "sources.photo_library_directory.sync_mode"
type = "select"
label = "Sync Mode"
description = "How this photo source should be synchronized."
default = "interval"
required = true
options = [{ "label" = "Manual", "value" = "manual" }, { "label" = "Automatic", "value" = "interval" }]
section = "general"
surface = "timeline"
order = 20
